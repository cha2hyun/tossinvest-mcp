[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tossinvest-mcp"
version = "0.1.2"
description = "A safe, Docker-ready MCP server for the official Toss Securities Open API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "cha2hyun", email = "cha2hyun.dev@gmail.com" },
]
dependencies = [
  "anyio>=4.9,<5",
  "fastmcp==4.0.3",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.9,<3",
  "uvicorn[standard]>=0.53.0,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pyyaml>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.16.7,<1",
]

[project.scripts]
tossinvest-mcp = "tossinvest_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tossinvest_mcp"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tossinvest_mcp"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
